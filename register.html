<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Registration</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

    <div class="login-container">

        <h1>
            🎓 Student Registration
        </h1>

        <h2>
            Create Your Account
        </h2>
        <p>After registering, wait for admin approval before logging in.</p>


        <form id="registerForm">


            <!-- Student ID -->

            <label for="studentId">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="Enter Student ID"
                required
            >


            <br><br>


            <!-- Full Name -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter Full Name"
                required
            >


            <br><br>


            <!-- Email -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >


            <br><br>


            <!-- Department -->

            <label for="department">
                Department
            </label>

            <input
                type="text"
                id="department"
                placeholder="Enter Department"
                required
            >


            <br><br>


            <!-- Password -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create Password"
                required
            >


            <br><br>


            <!-- Register Button -->

            <button type="submit">
                Register
            </button>


        </form>


        <br>


        <p style="text-align: center;">

            Already have an account?

            <a href="/">
                Login
            </a>

        </p>

    </div>


    <script src="/js/app.js"></script>

</body>

</html>
