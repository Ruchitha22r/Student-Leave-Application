<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Login | Leave Management System</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

    <div class="login-container">

        <h1>
            🎓 Student Leave Portal
        </h1>

        <h2>
            Student Login
        </h2>


        <form id="loginForm">


            <!-- Student ID -->

            <label for="studentId">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="Enter Student ID"
                required
            >


            <br><br>


            <!-- Password -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >


            <br><br>


            <!-- Login Button -->

            <button
                type="submit"
            >
                Student Login
            </button>


        </form>


        <br>


        <p style="text-align: center;">

            Don't have an account?

            <a href="/register.html">
                Register
            </a>

        </p>


        <p style="text-align: center;">

            <a href="/">
                ← Back to Login Selection
            </a>

        </p>

    </div>


    <script src="/js/app.js"></script>

</body>

</html>
