<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Dashboard | Leave Management System</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

    <div class="login-container">

        <h1>
            🎓 Student Leave Portal
        </h1>

        <h2>
            Student Dashboard
        </h2>


        <p>
            Welcome,
            <strong id="studentName">
                Student
            </strong>
        </p>


        <p>
            Department:
            <strong id="studentDepartment">
                Department
            </strong>
        </p>


        <hr>


        <h3>
            Leave Management
        </h3>


        <!-- Apply for Leave -->

        <button
            type="button"
            id="applyLeaveButton"
        >
            Apply for Leave
        </button>


        <br><br>


        <!-- Leave History -->

        <button
            type="button"
            id="leaveHistoryButton"
        >
            View Leave History
        </button>


        <br><br>


        <!-- Logout -->

        <button
            type="button"
            id="logoutButton"
        >
            Logout
        </button>

    </div>


    <script src="/js/app.js"></script>

</body>

</html>
