<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Leave Management System</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

    <div class="login-container">

        <h1>
            🎓 Student Leave Portal
        </h1>

        <h2>
            Admin Login
        </h2>


        <form id="adminLoginForm">


            <!-- Admin Username -->

            <label for="adminUsername">
                Admin Username
            </label>

            <input
                type="text"
                id="adminUsername"
                placeholder="Enter Admin Username"
                required
            >


            <br><br>


            <!-- Admin Password -->

            <label for="adminPassword">
                Admin Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter Admin Password"
                required
            >


            <br><br>


            <!-- Login Button -->

            <button
                type="submit"
            >
                Admin Login
            </button>


        </form>


        <br>


        <p style="text-align: center;">

            Student?

            <a href="/">
                Student Login
            </a>

        </p>

    </div>


    <script src="/js/app.js"></script>

</body>

</html>
