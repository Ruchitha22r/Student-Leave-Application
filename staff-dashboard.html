<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staff Portal</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="login-container"><h1>Staff Portal</h1><p id="staffWelcome">Loading staff account...</p><p>Your account has been approved. You are signed in to the staff portal.</p><button id="staffLogoutButton" type="button">Logout</button></div><script>document.addEventListener('DOMContentLoaded',()=>{const staff=localStorage.getItem('staff');if(!staff){window.location.href='/staff-login.html';return;}try{const user=JSON.parse(staff);document.getElementById('staffWelcome').textContent='Welcome, '+user.name+' ('+user.staff_id+').';}catch(e){localStorage.removeItem('staff');window.location.href='/staff-login.html';}document.getElementById('staffLogoutButton').addEventListener('click',()=>{localStorage.removeItem('staff');window.location.href='/staff-login.html';});});</script></body></html>
